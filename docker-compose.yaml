version: "3.9"
services:
  user-service:
    build: ./user-service
    ports:
      - "3000:3000" # HTTP (for NGINX / REST clients)
      - "50052:50051" # gRPC (for internal microservice comms)
    depends_on:
      - order-service

  order-service:
    build: ./order-service
    ports:
      - "50051:50051"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
