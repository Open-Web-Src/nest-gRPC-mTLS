name: Deploy Services to EC2 via ECR

on:
  push:
    branches: [dev]

jobs:
  deploy:
    name: Deploy to EC2 (Dev)
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    env:
      IMAGE_TAG: ${{ github.sha }}
      APP_DIR: /home/ec2-user

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS OIDC Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Inject mTLS Certs into user-service and order-service
        run: |
          mkdir -p user-service/certs order-service/certs

          echo "${{ secrets.USER_CRT }}" > user-service/certs/user.crt
          echo "${{ secrets.USER_KEY }}" > user-service/certs/user.key
          echo "${{ secrets.CA_CRT }}"   > user-service/certs/ca.crt

          echo "${{ secrets.ORDER_CRT }}" > order-service/certs/order.crt
          echo "${{ secrets.ORDER_KEY }}" > order-service/certs/order.key
          echo "${{ secrets.CA_CRT }}"    > order-service/certs/ca.crt

      - name: Build & Push Docker Images
        run: |
          # USER SERVICE
          docker build -t user-service:${{ env.IMAGE_TAG }} ./user-service
          docker tag user-service:${{ env.IMAGE_TAG }} \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_USER_REPO }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_USER_REPO }}:${{ env.IMAGE_TAG }}

          # ORDER SERVICE
          docker build -t order-service:${{ env.IMAGE_TAG }} ./order-service
          docker tag order-service:${{ env.IMAGE_TAG }} \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_ORDER_REPO }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_ORDER_REPO }}:${{ env.IMAGE_TAG }}

      - name: 📦 Copy docker-compose and nginx config to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yaml,nginx/nginx.conf"
          target: ${{ env.APP_DIR }}
          debug: true
      
      - name: 🚀 SSH Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd $APP_DIR

            # Update docker-compose.prod.yaml with the latest image tags
            sed -i "s|image:.*user-service.*|image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_USER_REPO }}:${{ env.IMAGE_TAG }}|" docker-compose.prod.yaml
            sed -i "s|image:.*order-service.*|image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_ORDER_REPO }}:${{ env.IMAGE_TAG }}|" docker-compose.prod.yaml

            # 🚀 Log in to ECR using EC2 IAM role
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            docker-compose -f docker-compose.prod.yaml pull
            docker-compose -f docker-compose.prod.yaml down
            docker-compose -f docker-compose.prod.yaml up -d
